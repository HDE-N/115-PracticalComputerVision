# 標定板版本：UI「標定板」分頁中「標定板版本」下拉選單的選項。
# 由 UI 的「另存為版本」自動寫入，也可以手動編輯；格式與 board.yaml 相同，長度單位 mm。
# 套用版本後要按「寫回設定檔」才會成為 board.yaml 的預設值，否則只用於本次執行。
presets:
  default_7x5:
    name: default_7x5
    dictionary: DICT_5X5_100
    squares_x: 7
    squares_y: 5
    square_length_mm: 30.0
    marker_length_mm: 22.0
    legacy_pattern: false
