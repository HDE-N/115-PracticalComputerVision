# ChArUco 標定板參數
# !! 以下為預設值，請依實際標定板修改，長度請用尺「實際量測」印出後的尺寸（單位 mm）!!
# 參數錯誤時，預覽畫面會偵測不到角點（corners 0），或標定誤差異常大。

dictionary: DICT_5X5_100   # ArUco 字典，常見：DICT_4X4_50、DICT_5X5_100、DICT_6X6_250
squares_x: 7               # 橫向方格數（不是內角點數）
squares_y: 5               # 縱向方格數
square_length_mm: 30.0     # 方格邊長（實測）
marker_length_mm: 22.0     # ArUco 邊長（實測），必須小於方格邊長
legacy_pattern: false      # 用 OpenCV 4.6 以前產生的板子（且方格數為偶數）時設 true
